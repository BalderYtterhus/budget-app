<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BudgetBandz — Redesign Explorations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    html, body, #root { margin: 0; padding: 0; height: 100%; }
    body { font-family: Inter, system-ui, sans-serif; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="variants.jsx"></script>
  <script type="text/babel" src="variants-settle.jsx"></script>
  <script type="text/babel" src="variants-settle-rest.jsx"></script>
  <script type="text/babel" src="d2-pages.jsx"></script>
  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;

    function App() {
      return (
        <DesignCanvas>
          <DCPostIt x={40} y={40} width={380}>
            <div style={{fontWeight: 600, marginBottom: 6, fontSize: 14}}>D² · The full app</div>
            <div style={{lineHeight: 1.5}}>
              Top section is the new one: every page reachable from the D² sidebar.
              Click any artboard's expand button to view fullscreen. The dashboard
              variants and earlier explorations remain below.
            </div>
          </DCPostIt>

          <DCSection id="d2-pages" title="D² · Sidebar sub-pages" subtitle="Pages accessible from the sidebar nav · Kvitteringer / Oppgjør / Kategorier / Rapporter + Ny kvittering flow">
            <DCArtboard id="d2-kvitt" label="Kvitteringer (receipts list)" width={1280} height={1480}>
              <PageReceipts />
            </DCArtboard>
            <DCArtboard id="d2-oppgjor" label="Oppgjør (settlement)" width={1280} height={1040}>
              <PageOppgjor />
            </DCArtboard>
            <DCArtboard id="d2-kat" label="Kategorier" width={1280} height={1040}>
              <PageKategorier />
            </DCArtboard>
            <DCArtboard id="d2-rap" label="Rapporter" width={1280} height={1080}>
              <PageRapporter />
            </DCArtboard>
            <DCArtboard id="d2-ny" label="+ Ny kvittering (scan flow)" width={1280} height={1040}>
              <PageNyKvittering />
            </DCArtboard>
          </DCSection>

          <DCSection id="settle" title="Dashboards with settlement" subtitle="Four styles · same settlement model · 1280×960">
            <DCArtboard id="sage-settle-dash" label="B² · Sage" width={1280} height={960}>
              <VariantSageSettle />
            </DCArtboard>
            <DCArtboard id="warm-settle" label="A² · Warm linen" width={1280} height={960}>
              <VariantWarmSettle />
            </DCArtboard>
            <DCArtboard id="ed-settle" label="C² · Editorial" width={1280} height={960}>
              <VariantEditorialSettle />
            </DCArtboard>
            <DCArtboard id="sb-settle" label="D² · Fintech sidebar" width={1280} height={960}>
              <VariantSidebarSettle />
            </DCArtboard>
          </DCSection>

          <DCSection id="detail" title="Settlement detail page" subtitle="Dedicated oppgjør view — currently only built for the sage direction">
            <DCArtboard id="sage-settle-detail" label="B³ · Sage detail page" width={1280} height={1040}>
              <VariantSettleDetail />
            </DCArtboard>
          </DCSection>

          <DCSection id="originals" title="Earlier explorations" subtitle="Dashboards before settlement was layered in">
            <DCArtboard id="sage" label="B · Sage (original)" width={1280} height={880}>
              <VariantSage />
            </DCArtboard>
            <DCArtboard id="warm" label="A · Warm linen" width={1280} height={880}>
              <VariantWarm />
            </DCArtboard>
            <DCArtboard id="editorial" label="C · Editorial" width={1280} height={880}>
              <VariantEditorial />
            </DCArtboard>
            <DCArtboard id="sidebar" label="D · Fintech sidebar" width={1280} height={880}>
              <VariantSidebar />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
